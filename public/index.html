<!DOCTYPE html>
<html lang="en-GB">

<head>
  <meta charset="utf-8">
  <link rel="shortcut icon" type="image/jpg" href="images/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kian Mayne - Software Engineer">
  <title>Kian Mayne - Software Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    html {
      background: #202124;
    }

    body {
      width: 80%;
      margin: auto;
      text-align: center;
      color: #e8eaed;
      font-family: 'JetBrains Mono', monospace;
    }

    header {
      padding: 48px 0 24px 0;
    }

    header > h1 {
      font-size: 1.6em;
      margin-bottom: 0;
    }

    header > h2 {
      font-size: 1.1em;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: 'JetBrains Mono', monospace;
    }

    .avatar {
      border-radius: 50%;
      border: 3px solid white;
      width: 160px;
    }

    .projects {
      max-width: 640px;
      margin: 0 auto;
    }

    .projects > h2 {
      text-align: left;
    }

    footer {
      padding: 40px 0 48px 0;
    }

    .social-link {
      text-decoration: none;
      margin: 0 8px;
      opacity: 0.6;
    }

    .social-link:hover,
    .social-link:focus-visible {
      opacity: 1;
    }

    .social-link > img {
      width: 24px;
    }

    .project-list {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .project {
      flex: 1 1 240px;
      overflow: hidden;
      border: 2px solid #5f6368;
      border-radius: 8px;
      color: inherit;
      text-align: left;
      text-decoration: none;
    }

    .project:hover,
    .project:focus-visible {
      border-color: #e8eaed;
    }

    .project > img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-bottom: 2px solid #5f6368;
    }

    .project > h3 {
      margin: 16px 20px 8px 20px;
    }

    .project > p {
      margin: 0 20px 16px 20px;
      color: #bdc1c6;
    }

  </style>
</head>

<body>
  <header>
    <img src="images/avatar.jpg" class="avatar" alt="Moss from the IT crowd writing an email about fire">
    <h1>Kian Mayne</h1>
    <h2>Software Engineer</h2>
  </header>
  <section class="projects">
    <h2>Projects</h2>
    <div class="project-list">
      <a class="project" href="/clipbox/" target="_blank">
        <img src="images/clipbox.jpg" alt="Clipbox showing a pasted JSON object as a collapsible tree" width="1280" height="800">
        <h3>Clipbox</h3>
        <p>Paste anything (text, JSON, CSV, images, files) and inspect it in the browser.</p>
      </a>
      <a class="project" href="/moon-sim/" target="_blank">
        <img src="images/moon-sim.jpg" alt="Moon Sim showing the Earth–Moon orbit, the night sky and simulation controls" width="1280" height="800">
        <h3>Moon Sim</h3>
        <p>A 3D Earth, Moon and Sun simulator, computed from real astronomy.</p>
      </a>
    </div>
  </section>
  <footer>
    <a class="social-link" href="https://github.com/KMayne">
      <img src="images/github.svg" alt="GitHub">
    </a>
    <a class="social-link" href="https://www.linkedin.com/in/kianmayne/">
      <img src="images/linkedin.svg" alt="LinkedIn">
    </a>
  </footer>
</body>

</html>
