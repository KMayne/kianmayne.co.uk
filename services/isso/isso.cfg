# Isso settings. Secrets ([admin], [hash] and [smtp]) are NOT here: they come from the
# "isso" Kubernetes Secret and are joined onto this file when the pod starts (see README.md).
# Reference: https://isso-comments.de/docs/reference/server-config/

[general]
dbpath = /db/comments.db
# Pages allowed to use the comments
host =
    https://www.kianmayne.co.uk
    https://kianmayne.co.uk
    http://localhost:8080
# How long a reader can edit or delete their own comment
max-age = 15m
# "stdout" logs new comments. Set to "smtp" (and fill in [smtp] in the secret) to get an
# email for each new comment, with one-click Activate and Delete links.
notify = stdout
reply-notifications = false
gravatar = false
latest-enabled = false

[moderation]
# Every new comment is hidden until you approve it
enabled = true
approve-if-email-previously-approved = false
# Unapproved comments are deleted after this long
purge-after = 30d

[server]
# The public Funnel URL, used in admin and notification links
public-endpoint = https://comments.YOUR-TAILNET.ts.net

[guard]
enabled = true
# New comments per reader per minute
ratelimit = 2
direct-reply = 3
reply-to-self = false
require-author = false
require-email = false
