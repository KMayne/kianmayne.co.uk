apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: isso-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isso
spec:
  replicas: 1 # SQLite: one pod
  strategy:
    type: Recreate # don't run two pods on the same volume during a rollout
  selector:
    matchLabels: { app: isso }
  template:
    metadata:
      labels: { app: isso }
    spec:
      initContainers:
        # Isso reads one config file: join the committed settings and the secret ones
        - name: config
          image: ghcr.io/isso-comments/isso:0.14.0
          command: ["sh", "-c", "cat /etc/isso/isso.cfg /etc/isso-secrets/secrets.cfg > /config/isso.cfg"]
          volumeMounts:
            - { name: app, mountPath: /etc/isso, readOnly: true }
            - { name: secrets, mountPath: /etc/isso-secrets, readOnly: true }
            - { name: config, mountPath: /config }
      containers:
        - name: isso
          image: ghcr.io/isso-comments/isso:0.14.0
          # The image's entrypoint is gunicorn; run Isso through proxied.py instead of isso.run
          args: ["--pythonpath", "/etc/isso", "proxied:application"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /info, port: http }
          livenessProbe:
            httpGet: { path: /info, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: app, mountPath: /etc/isso, readOnly: true }
            - { name: config, mountPath: /config, readOnly: true }
            - { name: data, mountPath: /db }
      volumes:
        - name: app
          configMap: { name: isso-app }
        - name: secrets
          secret: { secretName: isso }
        - name: config
          emptyDir: { medium: Memory } # holds the joined config, secrets included
        - name: data
          persistentVolumeClaim: { claimName: isso-data }
---
apiVersion: v1
kind: Service
metadata:
  name: isso
spec:
  selector: { app: isso }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Public via Tailscale Funnel, through the Tailscale Kubernetes operator.
# Serves https://comments.<your-tailnet>.ts.net (the host is the tls.hosts entry).
# Funnel sets X-Forwarded-For to the visitor's address, which proxied.py trusts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: isso
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: isso
      port: { name: http }
  tls:
    - hosts: [comments]
