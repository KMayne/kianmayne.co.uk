# Apply with:  kubectl apply -k services/isso
# First create the "isso" secret it reads (see README.md).
namespace: comments

resources:
  - k8s/namespace.yaml
  - k8s/isso.yaml

# Editing either file and re-applying rolls the pod.
configMapGenerator:
  - name: isso-app
    files:
      - isso.cfg
      - proxied.py
