apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: remark42-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remark42
spec:
  replicas: 1 # BoltDB: one writer
  strategy:
    type: Recreate # don't run two pods on the same volume during a rollout
  selector:
    matchLabels: { app: remark42 }
  template:
    metadata:
      labels: { app: remark42 }
    spec:
      # The image starts as root to set up /srv (it rewrites the web files with REMARK_URL and
      # chowns the data dir), then drops to its unprivileged "app" user to run the server.
      containers:
        - name: remark42
          image: umputun/remark42:v1.18.0
          env:
            # The public Funnel URL: https://comments.<your-tailnet>.ts.net
            - { name: REMARK_URL, value: https://comments.YOUR-TAILNET.ts.net }
            - { name: SITE, value: kianmayne }
            # Pages allowed to embed the comments (frame-ancestors)
            - name: ALLOWED_HOSTS
              value: "'self',https://www.kianmayne.co.uk,https://kianmayne.co.uk,http://localhost:8080"
            - { name: TIME_ZONE, value: Europe/London }
            - { name: INIT_QUIET, value: "1" }
            # Anyone can comment with just a name. Turn off if spam shows up.
            - { name: AUTH_ANON, value: "true" }
            - { name: EMOJI, value: "true" }
            - { name: MAX_COMMENT_SIZE, value: "4000" }
            # Comments can be edited for 10 minutes after posting
            - { name: EDIT_TIME, value: 10m }
          envFrom:
            # SECRET (required), and optionally AUTH_GITHUB_CID, AUTH_GITHUB_CSEC, ADMIN_SHARED_ID
            - secretRef: { name: remark42 }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /srv/var }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: remark42-data }
---
apiVersion: v1
kind: Service
metadata:
  name: remark42
spec:
  selector: { app: remark42 }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Public via Tailscale Funnel, through the Tailscale Kubernetes operator.
# Serves https://comments.<your-tailnet>.ts.net (the host is the tls.hosts entry).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remark42
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: remark42
      port: { name: http }
  tls:
    - hosts: [comments]
